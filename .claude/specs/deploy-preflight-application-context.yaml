meta:
  name: "deploy-preflight-application-context"
  version: "1.0"
  repo: "/Users/zhangqihang/MyWork/workrc/rainbond-ui"
  branch: "v6.9.6-dev"
  design_doc: "/Users/zhangqihang/MyWork/workrc/rainbond-console/docs/plans/2026-07-28-deploy-preflight-permission-scope-design.md"
  created_at: "2026-07-28"

constraints:
  - "Promote an existing payload group_id to the deploy_preflight request top level"
  - "Keep the complete nested payload unchanged for the preflight service"
  - "Omit top-level group_id for new-application requests that do not have one"
  - "Do not change UI rendering, DVA effects, endpoint path, or response handling"

sprints:
  - id: sprint-1
    name: "Send deploy preflight application context"
    commits:
      - id: commit-1
        message: "fix: send deploy preflight application context"
        tasks: [task-1.1]
    tasks:
      - id: task-1.1
        name: "Build and send the scoped deploy preflight request"
        status: pending
        files:
          create:
            - path: "src/services/deployPreflightRequest.js"
            - path: "src/services/deployPreflightRequest.node.test.js"
          modify:
            - path: "src/services/createApp.js"
              lines: "1-5,519-533"
        steps:
          - action: "write-test"
            description: "Add Node tests for explicit top-level precedence, legacy nested group_id promotion, nested payload identity, and omission for a new application."
            code: |
              const assert = require('assert');
              const { buildDeployPreflightRequestData } = require('./deployPreflightRequest');

              const payload = { group_id: 7, git_url: 'https://git.example.com/team/web.git' };
              assert.deepStrictEqual(buildDeployPreflightRequestData({
                deploy_type: 'source_code',
                group_id: 8,
                payload
              }), {
                deploy_type: 'source_code',
                group_id: 8,
                payload
              });
              assert.deepStrictEqual(buildDeployPreflightRequestData({
                deploy_type: 'source_code',
                payload
              }), {
                deploy_type: 'source_code',
                group_id: 7,
                payload
              });
              assert.deepStrictEqual(buildDeployPreflightRequestData({
                deploy_type: 'image',
                payload: { docker_cmd: 'nginx:latest' }
              }), {
                deploy_type: 'image',
                payload: { docker_cmd: 'nginx:latest' }
              });
            run: "node src/services/deployPreflightRequest.node.test.js"
            expect: "FAIL before implementation"
          - action: "implement"
            description: "Add a small CommonJS request-data helper and use it from the existing service function. This matches the repository's Node-testable helper pattern."
            code: |
              function buildDeployPreflightRequestData(body = {}) {
                const payload = body.payload || {};
                const data = {
                  deploy_type: body.deploy_type,
                  payload
                };
                const groupId = body.group_id || payload.group_id;
                if (groupId) {
                  data.group_id = groupId;
                }
                return data;
              }

              module.exports = {
                buildDeployPreflightRequestData
              };

              // createApp.js integration:
              import deployPreflightRequest from './deployPreflightRequest';
              const { buildDeployPreflightRequestData } = deployPreflightRequest;
              // ...
              data: buildDeployPreflightRequestData(body),
            run: "node src/services/deployPreflightRequest.node.test.js"
            expect: "PASS"
          - action: "verify"
            description: "Run the new request-contract test, the existing preflight payload test, and the mandatory production build."
            run: "node src/services/deployPreflightRequest.node.test.js && node src/components/CreateComponentModal/deployPreflightPayload.node.test.js && yarn build"
            expect: "exit 0"
        acceptance:
          - cmd: "node src/services/deployPreflightRequest.node.test.js"
            expect: "exit 0"
          - cmd: "node src/components/CreateComponentModal/deployPreflightPayload.node.test.js"
            expect: "exit 0"
          - cmd: "yarn build"
            expect: "exit 0"
        references:
          - path: "src/services/createApp.js:519-533"
            note: "Existing deploy_preflight HTTP request"
          - path: "src/components/CreateComponentModal/deployPreflightPayload.js:1-70"
            note: "Existing nested group_id payload generation"

